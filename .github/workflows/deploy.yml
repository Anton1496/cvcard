name: Auto Deploy

on:
  push:
    branches:
      - main  # Если твоя главная ветка в github называется master, напиши тут master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and run git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            git config --global --add safe.directory /var/www/fastuser/data/www/pospelov-med.ru
            cd /var/www/fastuser/data/www/pospelov-med.ru
            git pull origin main
            chown -R fastuser:fastuser /var/www/fastuser/data/www/pospelov-med.ru